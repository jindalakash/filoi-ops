# Production stack for a VPS (e.g. Hostinger KVM). Usage:
#   cp .env.example .env   # fill in secrets; set DATABASE_URL host to "db"
#   docker compose up -d --build
#   docker compose exec app node node_modules/tsx/dist/cli.mjs prisma/seed.ts   # first admin
services:
  db:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_DB: filoi_ops
      POSTGRES_USER: filoi
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
  app:
    build: .
    restart: unless-stopped
    depends_on: [db]
    env_file: .env
    environment:
      DATABASE_URL: postgresql://filoi:${POSTGRES_PASSWORD}@db:5432/filoi_ops
      UPLOAD_DIR: /app/storage/uploads   # fixed here so a copied .env can't point uploads outside the volume
      BACKUP_DIR: /app/backups
      TZ: Asia/Kolkata                    # reminders & backups run on India time
    ports:
      - "127.0.0.1:3000:3000"   # put Caddy/Nginx in front for HTTPS
    volumes:
      - uploads:/app/storage/uploads
      - ./backups:/app/backups   # on the host, so you can copy them off the server
volumes:
  pgdata:
  uploads:
